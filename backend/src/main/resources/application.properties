spring.application.name=kannada-api

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/kannada_db?useSSL=false
spring.datasource.username=postgres
spring.datasource.password=admin@123

# populating DB
# for commandLine method
#spring.profiles.active=dev
# This ensures that data.sql runs after Hibernate has finished its setup.
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# JPA Configuration
#spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Explicitly set Hikari connection pool properties
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.auto-commit=true

